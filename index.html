<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 Christmas Wish Lists 🎁</title>
  <style>
    :root {
      --bg-color: #0f1f17;
      --card-bg: #182e23;
      --card-border: #244636;
      --accent-red: #c93b3b;
      --accent-red-hover: #b02a2a;
      --accent-gold: #e2b442;
      --text-main: #f3f7f4;
      --text-muted: #9eb8a7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .subhead {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .filter-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent-gold);
      color: #1a1a1a;
      border-color: var(--accent-gold);
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 25px;
    }

    .form-card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--accent-gold);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    input, select {
      width: 100%;
      background: #0b1711;
      border: 1px solid var(--card-border);
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      outline: 1px solid var(--accent-gold);
    }

    .form-actions {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-submit {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-submit:hover { background: var(--accent-red-hover); }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .item-thumb-box {
      width: 100%;
      height: 180px;
      background: #080f0b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .item-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-thumb-box .placeholder {
      font-size: 2.5rem;
    }

    .item-body {
      padding: 14px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .item-child-badge {
      background: rgba(226, 180, 66, 0.15);
      color: var(--accent-gold);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .item-title a {
      color: var(--text-main);
      text-decoration: none;
    }

    .item-title a:hover { text-decoration: underline; }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .item-notes {
      font-size: 0.85rem;
      color: #b5c7bc;
      margin-bottom: 12px;
      flex-grow: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎄 Christmas Wish Lists 🎁</h1>
    <div class="subhead">Add items and ideas you would love for Christmas!</div>
  </header>

  <div class="filter-tabs">
    <button class="tab-btn active" onclick="setFilter('All')">All Items</button>
    <button class="tab-btn" onclick="setFilter('Nora')">Nora</button>
    <button class="tab-btn" onclick="setFilter('Clara')">Clara</button>
    <button class="tab-btn" onclick="setFilter('Emily')">Emily</button>
    <button class="tab-btn" onclick="setFilter('Samantha')">Samantha</button>
  </div>

  <div class="form-card">
    <h2>Add an Item to the Wish List</h2>
    <div class="form-grid">
      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Who is this for?</label>
        <select id="input-child">
          <option value="Nora">Nora</option>
          <option value="Clara">Clara</option>
          <option value="Emily">Emily</option>
          <option value="Samantha">Samantha</option>
        </select>
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Product Link (URL)</label>
        <input type="url" id="input-url" placeholder="https://..." onblur="autoFetchMetadata()">
      </div>

      <div>
        <label style="font-size: 0.8rem; color: var(--text-muted);">Item Name</label>
        <input type="text" id="input-title" placeholder="e.g., Cozy Flannel Pajamas">
