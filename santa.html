<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎅 Santa's Workshop - Shopper Portal</title>
  <style>
    :root {
      --bg-color: #0f1f17;
      --card-bg: #182e23;
      --card-border: #244636;
      --accent-red: #c93b3b;
      --accent-red-hover: #b02a2a;
      --accent-gold: #e2b442;
      --text-main: #f3f7f4;
      --text-muted: #9eb8a7;
      --purchased-bg: #122119;
      --purchased-border: #1b3024;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .subhead {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* Legend Box */
    .legend-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      gap: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }

    /* Filter Toolbar */
    .filter-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-grow: 1;
      min-width: 180px;
    }

    .filter-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .filter-group select {
      background: #0b1711;
      border: 1px solid var(--card-border);
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent-gold);
      color: #1a1a1a;
      border-color: var(--accent-gold);
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.2s;
    }

    .item-card.is-top {
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 14px rgba(226, 180, 66, 0.35);
    }

    .item-card.is-purchased {
      background: var(--purchased-bg);
      border-color: var(--purchased-border);
      opacity: 0.55;
    }

    .item-thumb-box {
      width: 100%;
      height: 180px;
      background: #080f0b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .item-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-thumb-box .placeholder {
      font-size: 2.5rem;
    }

    .item-body {
      padding: 14px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .item-child-badge {
      background: rgba(226, 180, 66, 0.15);
      color: var(--accent-gold);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .priority-selector {
      background: #0b1711;
      border: 1px solid var(--card-border);
      color: white;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .item-title a {
      color: var(--text-main);
      text-decoration: none;
    }

    .item-title a:hover { text-decoration: underline; }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .item-notes {
      font-size: 0.85rem;
      color: #b5c7bc;
      margin-bottom: 12px;
      flex-grow: 1;
    }

    .purchase-control {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .purchase-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }

    .purchase-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-red);
      cursor: pointer;
    }

    .buyer-info {
      font-size: 0.75rem;
      color: var(--accent-gold);
      text-align: right;
      line-height: 1.2;
    }

    /* Custom Goofy Face Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: var(--card-bg);
      border: 2px solid var(--accent-gold);
      padding: 24px;
      border-radius: 12px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .modal-box img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-gold);
      margin-bottom: 14px;
    }

    .modal-box h3 {
      color: var(--accent-gold);
      margin-bottom: 8px;
      font-size: 1.2rem;
    }

    .modal-box p {
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-btn {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 10px 24px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .modal-btn:hover { background: var(--accent-red-hover); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎅 Santa's Workshop</h1>
    <div class="subhead">Adult Gift Tracker & Shopping Status</div>
  </header>

  <!-- Legend -->
  <div class="legend-box">
    <div class="legend-item"><span style="font-size: 1.3rem;">🤩</span> Top Choice</div>
    <div class="legend-item"><span style="font-size: 1.1rem;">😁</span> Medium Want</div>
    <div class="legend-item"><span>🙂</span> Regular</div>
  </div>

  <!-- Filter Toolbar -->
  <div class="filter-bar">
    <div class="filter-group">
      <label>FILTER BY PRIORITY</label>
      <select id="filter-priority" onchange="renderList()">
        <option value="all">All Priorities</option>
        <option value="top">🤩 Top Choice</option>
        <option value="medium">😁 Medium Want</option>
        <option value="regular">🙂 Regular</option>
      </select>
    </div>

    <div class="filter-group">
      <label>FILTER BY PRICE</label>
      <select id="filter-price" onchange="renderList()">
        <option value="all">All Prices</option>
        <option value="under25">Under $25</option>
        <option value="25to50">$25 - $50</option>
        <option value="over50">$50+</option>
      </select>
    </div>
  </div>

  <!-- Child Tabs -->
  <div class="filter-tabs">
    <button class="tab-btn active" onclick="setFilter('All')">All Items</button>
    <button class="tab-btn" onclick="setFilter('Nora')">Nora</button>
    <button class="tab-btn" onclick="setFilter('Clara')">Clara</button>
    <button class="tab-btn" onclick="setFilter('Emily')">Emily</button>
    <button class="tab-btn" onclick="setFilter('Samantha')">Samantha</button>
  </div>

  <div class="items-grid" id="items-container">
    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
      Loading workshop list...
    </div>
  </div>
</div>

<!-- Goofy Face Modal Popup -->
<div class="modal-overlay" id="goofy-modal">
  <div class="modal-box">
    <!-- Make sure you upload 'adam-goofy.jpg' to your GitHub repo root -->
    <img src="adam-goofy.jpg" alt="Adam's Goofy Face" onerror="this.src='https://via.placeholder.com/110?text=😜'">
    <h3>Hold Up!</h3>
    <p>Need to change or uncheck a purchase? Please text or call Adam directly so he can update it!</p>
    <button class="modal-btn" onclick="closeGoofyModal()">Got it!</button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx3g402tZ_rh37Lk4EBgs8hSbySSr9nnluRybLWQsWA49hlGA3rGaO9mqtm_mVnUU8UTQ/exec";

  let allItems = [];
  let currentChildFilter = "All";

  async function loadData() {
    try {
      const res = await fetch(`${API_URL}?t=${Date.now()}`);
      const data = await res.json();
      allItems = (data.items || []).map(normalizeItem);
      renderList();
    } catch (err) {
      console.error("Failed to load wishlist:", err);
      document.getElementById("items-container").innerHTML =
        `<div style="grid-column: 1 / -1; text-align: center; color: var(--accent-red);">
           Failed to connect to sheet. Please check script deployment.
         </div>`;
    }
  }

  function normalizeItem(raw) {
    return {
      id: String(raw.item_id || ""),
      child: String(raw.child_name || "General"),
      title: String(raw.item_title || "Untitled"),
      url: String(raw.item_url || ""),
      image: String(raw.image_url || ""),
      price: String(raw.price_range || ""),
      notes: String(raw.notes || ""),
      priority: String(raw.priority || "regular").toLowerCase(),
      purchased: !!(raw.purchased === true || raw.purchased === "TRUE" || raw.purchased === 1),
      purchased_by: String(raw.purchased_by || ""),
      date_purchased: String(raw.date_purchased || "")
    };
  }

  async function handleCheckboxClick(event, itemId, isCurrentlyPurchased) {
    if (isCurrentlyPurchased) {
      // Stop checkbox from unchecking and open Goofy Modal
      event.preventDefault();
      document.getElementById("goofy-modal").style.display = "flex";
      return;
    }

    // Checking an unpurchased item: Enforce name entry ("Hey, you forgot something!")
    let buyer = "";
    while (!buyer || buyer.trim() === "") {
      buyer = prompt("Who is purchasing this item? (Please enter your name):", "");
      if (buyer === null) {
        // Grandparent hit Cancel
        event.preventDefault();
        return;
      }
      buyer = buyer.trim();
      if (!buyer) {
        alert("Hey, you forgot something! Please enter your name so Adam knows who's shopping.");
      }
    }

    const target = allItems.find(i => i.id === itemId);
    if (target) {
      target.purchased = true;
      target.purchased_by = buyer;
      target.date_purchased = new Date().toLocaleDateString();
    }
    renderList();

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "toggle_purchase",
          item_id: itemId,
          purchased: true,
          purchased_by: buyer
        })
      });
    } catch (e) {
      console.warn("Sync failed:", e);
    }
  }

  function closeGoofyModal() {
    document.getElementById("goofy-modal").style.display = "none";
  }

  async function updateItemPriority(itemId, newPriority) {
    const target = allItems.find(i => i.id === itemId);
    if (target) {
      target.priority = newPriority;
    }
    renderList();

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "update_priority",
          item_id: itemId,
          priority: newPriority
        })
      });
    } catch (e) {
      console.warn("Priority update sync failed:", e);
    }
  }

  function setFilter(child) {
    currentChildFilter = child;
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.classList.toggle("active", btn.innerText === child || (child === "All" && btn.innerText === "All Items"));
    });
    renderList();
  }

  function checkPriceCategory(priceStr, category) {
    if (category === 'all') return true;
    if (!priceStr) return false;
    
    // Extract numbers from price string (e.g., "$25 - $30" -> max 30 or min 25)
    const numbers = priceStr.match(/\d+/g);
    if (!numbers || numbers.length === 0) return false;
    const maxVal = Math.max(...numbers.map(Number));

    if (category === 'under25') return maxVal <= 25;
    if (category === '25to50') return maxVal > 25 && maxVal <= 50;
    if (category === 'over50') return maxVal > 50;
    return true;
  }

  function renderList() {
    const container = document.getElementById("items-container");
    container.innerHTML = "";

    const priorityFilter = document.getElementById("filter-priority").value;
    const priceFilter = document.getElementById("filter-price").value;

    let filtered = allItems.filter(item => {
      const matchChild = (currentChildFilter === "All" || item.child.toLowerCase() === currentChildFilter.toLowerCase());
      const matchPriority = (priorityFilter === "all" || item.priority === priorityFilter);
      const matchPrice = checkPriceCategory(item.price, priceFilter);
      return matchChild && matchPriority && matchPrice;
    });

    // Sort: Unpurchased first, purchased items sink to bottom
    filtered.sort((a, b) => {
      if (a.purchased === b.purchased) return 0;
      return a.purchased ? 1 : -1;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">No items match these filters.</div>`;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = `item-card ${item.priority === 'top' ? 'is-top' : ''} ${item.purchased ? 'is-purchased' : ''}`;

      const thumb = item.image
        ? `<img src="${item.image}" alt="${item.title}" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>🎁</div>'">`
        : `<div class="placeholder">🎁</div>`;

      let emojiDisplay = "🙂";
      let emojiStyle = "font-size: 1rem;";
      if (item.priority === 'top') {
        emojiDisplay = "🤩";
        emojiStyle = "font-size: 1.5rem;";
      } else if (item.priority === 'medium') {
        emojiDisplay = "😁";
        emojiStyle = "font-size: 1.25rem;";
      }

      card.innerHTML = `
        <div class="item-thumb-box">${thumb}</div>
        <div class="item-body">
          <div class="item-header">
            <span class="item-child-badge">${item.child}</span>
            <select class="priority-selector" onchange="updateItemPriority('${item.id}', this.value)">
              <option value="top" ${item.priority === 'top' ? 'selected' : ''}>🤩 Top Choice</option>
              <option value="medium" ${item.priority === 'medium' ? 'selected' : ''}>😁 Medium</option>
              <option value="regular" ${item.priority === 'regular' ? 'selected' : ''}>🙂 Regular</option>
            </select>
          </div>
          <div style="margin-bottom: 6px; ${emojiStyle}">${emojiDisplay}</div>
          <div class="item-title">
            ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>` : item.title}
          </div>
          <div class="item-meta">
            <span>${item.price ? item.price : "Price unlisted"}</span>
            ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener" style="color: var(--accent-gold); text-decoration: none;">View Store ↗</a>` : ""}
          </div>
          ${item.notes ? `<div class="item-notes">${item.notes}</div>` : ""}
          <div class="purchase-control">
            <label class="purchase-label">
              <input type="checkbox" ${item.purchased ? "checked" : ""} onclick="handleCheckboxClick(event, '${item.id}', ${item.purchased})">
              <span>${item.purchased ? "PURCHASED" : "Mark as Bought"}</span>
            </label>
            ${item.purchased ? `<div class="buyer-info">${item.date_purchased}</div>` : ""}
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  loadData();
</script>

</body>
</html>
