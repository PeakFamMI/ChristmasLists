<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎅 Santa's Workshop - Shopper Portal</title>
  <style>
    :root {
      --bg-color: #0f1f17;
      --card-bg: #182e23;
      --card-border: #244636;
      --accent-red: #c93b3b;
      --accent-red-hover: #b02a2a;
      --accent-gold: #e2b442;
      --text-main: #f3f7f4;
      --text-muted: #9eb8a7;
      --purchased-bg: #122119;
      --purchased-border: #1b3024;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .subhead {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .filter-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent-gold);
      color: #1a1a1a;
      border-color: var(--accent-gold);
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: opacity 0.2s;
    }

    .item-card.is-purchased {
      background: var(--purchased-bg);
      border-color: var(--purchased-border);
      opacity: 0.55;
    }

    .item-thumb-box {
      width: 100%;
      height: 180px;
      background: #080f0b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .item-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-thumb-box .placeholder {
      font-size: 2.5rem;
    }

    .item-body {
      padding: 14px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .item-child-badge {
      background: rgba(226, 180, 66, 0.15);
      color: var(--accent-gold);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .item-title a {
      color: var(--text-main);
      text-decoration: none;
    }

    .item-title a:hover { text-decoration: underline; }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    .item-notes {
      font-size: 0.85rem;
      color: #b5c7bc;
      margin-bottom: 12px;
      flex-grow: 1;
    }

    .purchase-control {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .purchase-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }

    .purchase-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-red);
      cursor: pointer;
    }

    .buyer-info {
      font-size: 0.75rem;
      color: var(--accent-gold);
      text-align: right;
      line-height: 1.2;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎅 Santa's Workshop</h1>
    <div class="subhead">Adult Gift Tracker & Shopping Status</div>
  </header>

  <div class="filter-tabs">
    <button class="tab-btn active" onclick="setFilter('All')">All Items</button>
    <button class="tab-btn" onclick="setFilter('Nora')">Nora</button>
    <button class="tab-btn" onclick="setFilter('Clara')">Clara</button>
    <button class="tab-btn" onclick="setFilter('Emily')">Emily</button>
    <button class="tab-btn" onclick="setFilter('Samantha')">Samantha</button>
  </div>

  <div class="items-grid" id="items-container">
    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
      Loading workshop list...
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbx3g402tZ_rh37Lk4EBgs8hSbySSr9nnluRybLWQsWA49hlGA3rGaO9mqtm_mVnUU8UTQ/exec";

  let allItems = [];
  let currentFilter = "All";

  async function loadData() {
    try {
      const res = await fetch(`${API_URL}?t=${Date.now()}`);
      const data = await res.json();
      allItems = (data.items || []).map(normalizeItem);
      renderList();
    } catch (err) {
      console.error("Failed to load wishlist:", err);
      document.getElementById("items-container").innerHTML =
        `<div style="grid-column: 1 / -1; text-align: center; color: var(--accent-red);">
           Failed to connect to sheet. Please check script deployment.
         </div>`;
    }
  }

  function normalizeItem(raw) {
    return {
      id: String(raw.item_id || ""),
      child: String(raw.child_name || "General"),
      title: String(raw.item_title || "Untitled"),
      url: String(raw.item_url || ""),
      image: String(raw.image_url || ""),
      price: String(raw.price_range || ""),
      notes: String(raw.notes || ""),
      purchased: !!(raw.purchased === true || raw.purchased === "TRUE" || raw.purchased === 1),
      purchased_by: String(raw.purchased_by || ""),
      date_purchased: String(raw.date_purchased || "")
    };
  }

  async function togglePurchased(itemId, isPurchased) {
    let buyer = "";
    if (isPurchased) {
      buyer = prompt("Who is purchasing this item? (Name):", "") || "Adult";
    }

    const target = allItems.find(i => i.id === itemId);
    if (target) {
      target.purchased = isPurchased;
      target.purchased_by = isPurchased ? buyer : "";
      target.date_purchased = isPurchased ? new Date().toLocaleDateString() : "";
    }
    renderList();

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "toggle_purchase",
          item_id: itemId,
          purchased: isPurchased,
          purchased_by: buyer
        })
      });
    } catch (e) {
      console.warn("Sync failed:", e);
    }
  }

  function setFilter(child) {
    currentFilter = child;
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.classList.toggle("active", btn.innerText === child || (child === "All" && btn.innerText === "All Items"));
    });
    renderList();
  }

  function renderList() {
    const container = document.getElementById("items-container");
    container.innerHTML = "";

    let filtered = allItems.filter(item => currentFilter === "All" || item.child.toLowerCase() === currentFilter.toLowerCase());

    filtered.sort((a, b) => {
      if (a.purchased === b.purchased) return 0;
      return a.purchased ? 1 : -1;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">No items found for this filter.</div>`;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = `item-card ${item.purchased ? "is-purchased" : ""}`;

      const thumb = item.image
        ? `<img src="${item.image}" alt="${item.title}" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'>🎁</div>'">`
        : `<div class="placeholder">🎁</div>`;

      card.innerHTML = `
        <div class="item-thumb-box">${thumb}</div>
        <div class="item-body">
          <div class="item-header">
            <span class="item-child-badge">${item.child}</span>
          </div>
          <div class="item-title">
            ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>` : item.title}
          </div>
          <div class="item-meta">
            <span>${item.price ? item.price : "Price unlisted"}</span>
            ${item.url ? `<a href="${item.url}" target="_blank" rel="noopener" style="color: var(--accent-gold); text-decoration: none;">View Store ↗</a>` : ""}
          </div>
          ${item.notes ? `<div class="item-notes">${item.notes}</div>` : ""}
          <div class="purchase-control">
            <label class="purchase-label">
              <input type="checkbox" ${item.purchased ? "checked" : ""} onchange="togglePurchased('${item.id}', this.checked)">
              <span>${item.purchased ? "Purchased" : "Mark as Bought"}</span>
            </label>
            ${item.purchased ? `<div class="buyer-info">${item.purchased_by ? item.purchased_by + "<br>" : ""}${item.date_purchased}</div>` : ""}
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  loadData();
</script>

</body>
</html>
